
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subway Dash 3D</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  background: #050816;
  font-family: Arial, sans-serif;
  color: white;
  user-select: none;
}

canvas {
  display: block;
}

#hud {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 5;
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
}

.stat {
  background: rgba(5, 12, 30, 0.82);
  border: 1px solid #20eaff;
  border-radius: 12px;
  padding: 10px 13px;
  font-weight: bold;
  box-shadow: 0 0 12px #00cfff35;
}

#pauseBtn, #boardBtn {
  position: fixed;
  top: 15px;
  z-index: 6;
  border: 1px solid #20eaff;
  background: #07172b;
  color: white;
  padding: 11px 14px;
  border-radius: 10px;
  font-size: 15px;
  cursor: pointer;
}

#pauseBtn { right: 15px; }
#boardBtn { right: 100px; }

#help {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  text-align: center;
  background: rgba(5, 12, 30, 0.8);
  padding: 10px 15px;
  border-radius: 12px;
  font-size: 13px;
  width: max-content;
  max-width: 94%;
}

#overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(2, 5, 18, 0.76);
  padding: 20px;
}

.panel {
  width: 440px;
  max-width: 100%;
  padding: 28px;
  border-radius: 22px;
  text-align: center;
  background: linear-gradient(145deg, #111d3a, #080d20);
  border: 2px solid #14dfff;
  box-shadow: 0 0 35px #00d9ff44;
}

h1 {
  margin: 0 0 12px;
  font-size: clamp(30px, 7vw, 46px);
  color: #26eaff;
  text-shadow: 0 0 18px #00bfff;
}

.panel p { line-height: 1.6; color: #d4e8ff; }

.mainBtn {
  border: 0;
  border-radius: 12px;
  padding: 14px 25px;
  margin-top: 10px;
  background: linear-gradient(90deg, #00d9ff, #7b5cff);
  color: #03101f;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

#mobileControls {
  position: fixed;
  bottom: 85px;
  left: 0;
  right: 0;
  z-index: 6;
  display: flex;
  justify-content: space-between;
  padding: 0 15px;
  pointer-events: none;
}

.controlGroup {
  display: flex;
  gap: 8px;
  pointer-events: auto;
}

.controlBtn {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  border: 1px solid #27eaff;
  background: #07172bdd;
  color: white;
  font-size: 23px;
  touch-action: manipulation;
}

.hidden { display: none !important; }

#board {
  text-align: left;
  margin: 15px 0;
  padding: 15px;
  background: #050b19;
  border-radius: 12px;
  line-height: 1.9;
}
</style>
</head>

<body>

<div id="hud">
  <div class="stat">🏃 Score: <span id="score">0</span></div>
  <div class="stat">🪙 Coins: <span id="coins">0</span></div>
  <div class="stat">⚡ Speed: <span id="speed">1</span>x</div>
</div>

<button id="boardBtn">🏆 Scores</button>
<button id="pauseBtn">⏸ Pause</button>

<div id="help">
  ← → Move lanes · ↑ / SPACE Jump · ↓ Slide · P Pause
</div>

<div id="mobileControls">
  <div class="controlGroup">
    <button class="controlBtn" id="leftBtn">◀</button>
    <button class="controlBtn" id="rightBtn">▶</button>
  </div>
  <div class="controlGroup">
    <button class="controlBtn" id="jumpBtn">⬆</button>
    <button class="controlBtn" id="slideBtn">⬇</button>
  </div>
</div>

<div id="overlay">
  <div class="panel">
    <h1 id="title">SUBWAY DASH 3D</h1>
    <p id="message">
      Dodge incoming trains, jump over barriers, slide under signs,
      and collect coins!
    </p>
    <div id="board" class="hidden"></div>
    <button class="mainBtn" id="startBtn">▶ START RUN</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
(() => {
"use strict";

if (!window.THREE) {
  document.getElementById("message").textContent =
    "The 3D library could not load. Check your internet connection and reload this page.";
  document.getElementById("startBtn").textContent = "RELOAD";
  document.getElementById("startBtn").onclick = () => location.reload();
  return;
}

// ---------- GAME SETUP ----------

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x071023);
scene.fog = new THREE.Fog(0x071023, 35, 150);

const camera = new THREE.PerspectiveCamera(
  65, window.innerWidth / window.innerHeight, 0.1, 250
);
camera.position.set(0, 7, 13);
camera.lookAt(0, 1, -12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x8dcaff, 0x222233, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.position.set(-8, 18, 8);
sun.castShadow = true;
scene.add(sun);

const cyanLight = new THREE.PointLight(0x00ccff, 16, 45);
cyanLight.position.set(0, 5, -8);
scene.add(cyanLight);

const magentaLight = new THREE.PointLight(0xb300ff, 12, 35);
magentaLight.position.set(9, 4, -15);
scene.add(magentaLight);

const laneX = [-2.5, 0, 2.5];
const roadParts = [];
const scenery = [];
const obstacles = [];
const coinItems = [];

let player;
let running = false;
let paused = false;
let gameOver = false;
let score = 0;
let coins = 0;
let speed = 18;
let elapsed = 0;
let spawnTimer = 0;
let coinTimer = 0;
let jumpTimer = 0;
let slideTimer = 0;
let playerLane = 1;
let targetX = 0;
let bestScore = Number(localStorage.getItem("subwayBest") || 0);
let totalCoins = Number(localStorage.getItem("subwayCoins") || 0);
let runsPlayed = Number(localStorage.getItem("subwayRuns") || 0);

const $ = id => document.getElementById(id);

function material(color, extra = {}) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness: 0.65,
    ...extra
  });
}

const matRail = material(0x65778d, { metalness: 0.8, roughness: 0.3 });
const matTrack = material(0x252d40);
const matSleeper = material(0x51596b);
const matGold = material(0xffcf33, {
  metalness: 0.7,
  roughness: 0.22,
  emissive: 0x664000
});

// ---------- BASIC MESH HELPERS ----------

function box(parent, w, h, d, x, y, z, mat, cast = true) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d), mat
  );
  mesh.position.set(x, y, z);
  mesh.castShadow = cast;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function cylinder(parent, radiusTop, radiusBottom, height,
                  x, y, z, mat, segments = 12) {
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(
      radiusTop, radiusBottom, height, segments
    ), mat
  );
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  parent.add(mesh);
  return mesh;
}

// ---------- TRACK AND CITY ----------

function buildWorld() {
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 220),
    material(0x10182b)
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.set(0, -0.18, -55);
  ground.receiveShadow = true;
  scene.add(ground);

  box(scene, 8.5, 0.25, 200, 0, -0.04, -60, matTrack, false);

  // Three tracks
  for (let lane = 0; lane < 3; lane++) {
    const x = laneX[lane];

    box(scene, 2.25, 0.08, 200, x, 0.02, -60,
        material(0x202b3d), false);

    for (const side of [-0.82, 0.82]) {
      box(scene, 0.12, 0.14, 200, x + side, 0.1, -60,
          matRail, false);
    }
  }

  // Repeating sleepers
  for (let i = 0; i < 42; i++) {
    const z = 16 - i * 4;
    const sleeper = box(
      scene, 8, 0.12, 0.55, 0, 0.02, z, matSleeper, false
    );
    roadParts.push(sleeper);
  }

  // City buildings on both sides
  for (let i = 0; i < 38; i++) {
    for (const side of [-1, 1]) {
      const group = new THREE.Group();
      const height = 5 + Math.random() * 18;
      const width = 3 + Math.random() * 4;
      const depth = 4 + Math.random() * 5;
      const x = side * (7 + Math.random() * 8);
      const z = 12 - i * 6;

      const buildingMat = material(
        [0x152444, 0x20213d, 0x1a3043, 0x292443][
          Math.floor(Math.random() * 4)
        ],
        { roughness: 0.85 }
      );

      box(group, width, height, depth, 0, height / 2 - 0.1, 0,
          buildingMat, false);

      // Glowing windows
      const windowMat = new THREE.MeshStandardMaterial({
        color: 0x8eeaff,
        emissive: 0x1c7ca0,
        emissiveIntensity: 1.1
      });

      for (let row = 0; row < Math.floor(height / 2); row++) {
        for (let col = 0; col < 2; col++) {
          if (Math.random() > 0.22) {
            box(
              group, 0.45, 0.55, 0.06,
              (col - 0.5) * (width * 0.48),
              1 + row * 1.5,
              depth / 2 + 0.035,
              windowMat, false
            );
          }
        }
      }

      group.position.set(x, 0, z);
      scene.add(group);
      scenery.push(group);
    }
  }
}

// ---------- PLAYER CHARACTER ----------

function createPlayer() {
  player = new THREE.Group();

  const skin = material(0xffc18d);
  const shirt = material(0x12d7ff, {
    emissive: 0x004466,
    emissiveIntensity: 0.4
  });
  const pants = material(0x222d57);
  const shoes = material(0xf5f8ff);
  const hair = material(0x29202a);
  const eyeMat = material(0x111111);

  // Body
  box(player, 0.68, 0.8, 0.42, 0, 1.12, 0, shirt);
  box(player, 0.4, 0.45, 0.4, 0, 1.72, 0, skin);
  box(player, 0.46, 0.18, 0.43, 0, 1.98, 0, hair);

  // Face details
  box(player, 0.07, 0.07, 0.035, -0.1, 1.76, -0.214, eyeMat);
  box(player, 0.07, 0.07, 0.035, 0.1, 1.76, -0.214, eyeMat);

  // Arms and legs
  const leftArm = box(player, 0.2, 0.68, 0.23,
    -0.46, 1.1, 0, skin);
  const rightArm = box(player, 0.2, 0.68, 0.23,
    0.46, 1.1, 0, skin);

  const leftLeg = box(player, 0.25, 0.65, 0.28,
    -0.19, 0.4, 0, pants);
  const rightLeg = box(player, 0.25, 0.65, 0.28,
    0.19, 0.4, 0, pants);

  box(player, 0.3, 0.16, 0.42, -0.19, 0.1, -0.04, shoes);
  box(player, 0.3, 0.16, 0.42, 0.19, 0.1, -0.04, shoes);

  player.userData.parts = {
    leftArm, rightArm, leftLeg, rightLeg
  };

  player.position.set(0, 0, 3);
  scene.add(player);
}

// ---------- TRAINS AND OBSTACLES ----------

function makeTrain(lane, z) {
  const train = new THREE.Group();

  const bodyMat = material(0x153f73, {
    metalness: 0.35,
    roughness: 0.35
  });
  const stripeMat = material(0x00e5ff, {
    emissive: 0x007a99,
    emissiveIntensity: 1.5
  });
  const windowMat = material(0x9cecff, {
    emissive: 0x176caa,
    emissiveIntensity: 1
  });

  box(train, 1.85, 3.15, 9, 0, 1.65, 0, bodyMat);
  box(train, 1.9, 0.22, 8.9, 0, 0.18, 0, material(0x101522));
  box(train, 1.92, 0.18, 8.9, 0, 2.55, 0, stripeMat);

  // Front face
  box(train, 1.55, 0.95, 0.08, 0, 2.15, -4.53, windowMat);
  box(train, 0.13, 1.1, 0.1, 0, 2.05, -4.6, stripeMat);

  // Side windows
  for (const side of [-1, 1]) {
    for (let i = 0; i < 4; i++) {
      box(
        train, 0.045, 0.7, 1.15,
        side * 0.932, 2.0, -3 + i * 1.8,
        windowMat, false
      );
    }
  }

  // Headlights
  for (const x of [-0.55, 0.55]) {
    const lamp = new THREE.Mesh(
      new THREE.BoxGeometry(0.3, 0.2, 0.08),
      new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: 0xffffff,
        emissiveIntensity: 2
      })
    );
    lamp.position.set(x, 0.7, -4.58);
    train.add(lamp);
  }

  train.position.set(laneX[lane], 0, z);
  scene.add(train);

  return train;
}

function makeBarrier(lane, z, type) {
  const group = new THREE.Group();

  if (type === "barrier") {
    box(group, 1.5, 0.95, 0.55, 0, 0.48, 0,
      material(0xff593e));
    box(group, 1.58, 0.16, 0.62, 0, 0.65, 0,
      material(0xffd34f));
    box(group, 1.58, 0.16, 0.62, 0, 0.28, 0,
      material(0xffd34f));
  } else {
    // Overhead sign: slide underneath it
    box(group, 1.9, 0.25, 0.35, 0, 2.15, 0,
      material(0xffcf33));
    box(group, 0.14, 2.2, 0.18, -0.8, 1.1, 0,
      material(0x718199));
    box(group, 0.14, 2.2, 0.18, 0.8, 1.1, 0,
      material(0x718199));
    box(group, 1.1, 0.08, 0.06, 0, 2.15, -0.2,
      material(0x252525));
  }

  group.position.set(laneX[lane], 0, z);
  scene.add(group);

  return group;
}

function makeCoin(lane, z) {
  const coin = new THREE.Mesh(
    new THREE.TorusGeometry(0.34, 0.12, 10, 22),
    matGold
  );

  coin.position.set(laneX[lane], 1.45, z);
  coin.castShadow = true;
  scene.add(coin);

  return coin;
}

// ---------- SPAWNING ----------

function spawnObstacle() {
  const lane = Math.floor(Math.random() * 3);
  const r = Math.random();

  // Trains appear frequently and approach the player
  if (r < 0.55) {
    const train = makeTrain(lane, -90);
    obstacles.push({
      mesh: train,
      lane,
      type: "train",
      dead: false
    });
    return;
  }

  const type = r < 0.78 ? "barrier" : "overhead";
  const mesh = makeBarrier(lane, -70, type);

  obstacles.push({
    mesh,
    lane,
    type,
    dead: false
  });
}

function spawnCoins() {
  const lane = Math.floor(Math.random() * 3);

  for (let i = 0; i < 5; i++) {
    const mesh = makeCoin(lane, -52 - i * 2.4);
    coinItems.push({ mesh, lane, dead: false });
  }
}

// ---------- GAME CONTROLS ----------

function moveLane(direction) {
  if (!running || paused || gameOver) return;

  playerLane = Math.max(0, Math.min(2, playerLane + direction));
  targetX = laneX[playerLane];
}

function jump() {
  if (!running || paused || gameOver) return;
  if (jumpTimer <= 0 && slideTimer <= 0) jumpTimer = 0.78;
}

function slide() {
  if (!running || paused || gameOver) return;
  if (jumpTimer <= 0) slideTimer = 0.65;
}

function togglePause() {
  if (!running || gameOver) return;

  paused = !paused;
  $("pauseBtn").textContent = paused ? "▶ Resume" : "⏸ Pause";

  if (paused) {
    showOverlay("PAUSED", "Take a break, then resume your run.", "▶ RESUME");
  } else {
    hideOverlay();
  }
}

window.addEventListener("keydown", e => {
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(e.key)) {
    e.preventDefault();
  }

  if (e.repeat) return;

  if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") moveLane(-1);
  if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") moveLane(1);
  if (e.key === "ArrowUp" || e.key.toLowerCase() === "w" || e.key === " ") jump();
  if (e.key === "ArrowDown" || e.key.toLowerCase() === "s") slide();
  if (e.key.toLowerCase() === "p" || e.key === "Escape") togglePause();
});

$("leftBtn").addEventListener("click", () => moveLane(-1));
$("rightBtn").addEventListener("click", () => moveLane(1));
$("jumpBtn").addEventListener("click", jump);
$("slideBtn").addEventListener("click", slide);
$("pauseBtn").addEventListener("click", togglePause);
$("boardBtn").addEventListener("click", showScoreboard);
$("startBtn").addEventListener("click", () => {
  if (paused) {
    paused = false;
    $("pauseBtn").textContent = "⏸ Pause";
    hideOverlay();
  } else {
    startGame();
  }
});

// Touch swipe support
let touchStartX = 0;
let touchStartY = 0;

renderer.domElement.addEventListener("touchstart", e => {
  const touch = e.changedTouches[0];
  touchStartX = touch.clientX;
  touchStartY = touch.clientY;
}, { passive: true });

renderer.domElement.addEventListener("touchend", e => {
  const touch = e.changedTouches[0];
  const dx = touch.clientX - touchStartX;
  const dy = touch.clientY - touchStartY;

  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 35) {
    moveLane(dx > 0 ? 1 : -1);
  } else if (Math.abs(dy) > 35) {
    if (dy < 0) jump();
    else slide();
  }
}, { passive: true });

// ---------- OVERLAYS AND SCOREBOARD ----------

function showOverlay(title, message, buttonText) {
  $("title").textContent = title;
  $("message").textContent = message;
  $("startBtn").textContent = buttonText;
  $("overlay").classList.remove("hidden");
}

function hideOverlay() {
  $("overlay").classList.add("hidden");
}

function showScoreboard() {
  if (running && !paused) paused = true;

  $("pauseBtn").textContent = paused ? "▶ Resume" : "⏸ Pause";
  $("title").textContent = "🏆 SCOREBOARD";
  $("message").textContent = "Your personal game statistics";
  $("board").innerHTML =
    "⭐ Best score: <b>" + bestScore + "</b><br>" +
    "🪙 Total coins: <b>" + totalCoins + "</b><br>" +
    "🎮 Runs played: <b>" + runsPlayed + "</b><br>" +
    "📊 Current score: <b>" + Math.floor(score) + "</b>";

  $("board").classList.remove("hidden");
  $("startBtn").textContent = paused ? "▶ RESUME RUN" : "▶ START RUN";
  $("overlay").classList.remove("hidden");
}

function hideBoard() {
  $("board").classList.add("hidden");
}

function startGame() {
  clearObjects();

  score = 0;
  coins = 0;
  speed = 18;
  elapsed = 0;
  spawnTimer = 1;
  coinTimer = 2;
  jumpTimer = 0;
  slideTimer = 0;
  playerLane = 1;
  targetX = 0;
  paused = false;
  gameOver = false;
  running = true;
  runsPlayed++;

  localStorage.setItem("subwayRuns", runsPlayed);

  player.position.set(0, 0, 3);
  $("pauseBtn").textContent = "⏸ Pause";

  hideBoard();
  hideOverlay();
  updateHUD();
}

function clearObjects() {
  for (const item of obstacles) scene.remove(item.mesh);
  for (const item of coinItems) scene.remove(item.mesh);

  obstacles.length = 0;
  coinItems.length = 0;
}

function endGame() {
  running = false;
  gameOver = true;

  bestScore = Math.max(bestScore, Math.floor(score));
  localStorage.setItem("subwayBest", bestScore);
  localStorage.setItem("subwayCoins", totalCoins);

  showOverlay(
    "GAME OVER",
    "Score: " + Math.floor(score) +
    " · Coins this run: " + coins +
    " · Best score: " + bestScore,
    "🔁 PLAY AGAIN"
  );
}

function updateHUD() {
  $("score").textContent = Math.floor(score);
  $("coins").textContent = coins;
  $("speed").textContent = (speed / 18).toFixed(1);
}

// ---------- COLLISION DETECTION ----------

function checkCollisions() {
  const playerZ = player.position.z;

  for (const item of obstacles) {
    if (item.dead) continue;

    const dz = Math.abs(item.mesh.position.z - playerZ);
    const dx = Math.abs(item.mesh.position.x - player.position.x);

    if (dz > 3.4 || dx > 1.05) continue;

    if (item.type === "train") {
      // Trains cannot be jumped over. Switch to another lane!
      endGame();
      return;
    }

    if (item.type === "barrier") {
      // Jump over barriers
      if (jumpTimer <= 0.18) {
        endGame();
        return;
      }
    }

    if (item.type === "overhead") {
      // Slide under overhead signs
      if (slideTimer <= 0.15) {
        endGame();
        return;
      }
    }

    item.dead = true;
    scene.remove(item.mesh);
  }

  for (const item of coinItems) {
    if (item.dead) continue;

    const dz = Math.abs(item.mesh.position.z - playerZ);
    const dx = Math.abs(item.mesh.position.x - player.position.x);

    if (dz < 1.4 && dx < 1.0) {
      item.dead = true;
      scene.remove(item.mesh);
      coins++;
      totalCoins++;
      localStorage.setItem("subwayCoins", totalCoins);
    }
  }
}

// ---------- ANIMATION ----------

const clock = new THREE.Clock();

function update(dt) {
  if (!running || paused || gameOver) return;

  elapsed += dt;
  speed = Math.min(35, 18 + elapsed * 0.22);
  score += dt * speed * 0.55;

  spawnTimer -= dt;
  coinTimer -= dt;

  if (spawnTimer <= 0) {
    spawnObstacle();
    spawnTimer = Math.max(0.85, 1.55 - elapsed * 0.004);
  }

  if (coinTimer <= 0) {
    spawnCoins();
    coinTimer = 3.2 + Math.random() * 1.4;
  }

  // Player lane movement
  player.position.x += (targetX - player.position.x) *
    Math.min(1, dt * 13);

  // Jump arc
  if (jumpTimer > 0) {
    jumpTimer -= dt;
    const t = 0.78 - jumpTimer;
    player.position.y = Math.sin((t / 0.78) * Math.PI) * 2.1;
  } else {
    player.position.y = 0;
  }

  // Slide crouch
  if (slideTimer > 0) {
    slideTimer -= dt;
    player.scale.y = 0.55;
    player.position.y = 0;
  } else {
    player.scale.y = 1;
  }

  // Running arm and leg movement
  const parts = player.userData.parts;
  if (jumpTimer <= 0 && slideTimer <= 0) {
    const swing = Math.sin(elapsed * 12) * 0.45;
    parts.leftArm.rotation.x = swing;
    parts.rightArm.rotation.x = -swing;
    parts.leftLeg.rotation.x = -swing;
    parts.rightLeg.rotation.x = swing;
  } else {
    parts.leftArm.rotation.x = 0;
    parts.rightArm.rotation.x = 0;
    parts.leftLeg.rotation.x = 0;
    parts.rightLeg.rotation.x = 0;
  }

  // Move track sleepers toward the player
  for (const part of roadParts) {
    part.position.z += speed * dt;

    if (part.position.z > 18) {
      part.position.z -= 168;
    }
  }

  // Move buildings toward the player
  for (const building of scenery) {
    building.position.z += speed * dt;

    if (building.position.z > 22) {
      building.position.z -= 228;
    }
  }

  // Move obstacles toward the player
  for (const item of obstacles) {
    if (item.dead) continue;

    item.mesh.position.z += speed * dt;

    if (item.type === "train") {
      // Small headlight flicker effect
      item.mesh.rotation.y = Math.sin(elapsed * 2) * 0.005;
    }

    if (item.mesh.position.z > 15) {
      item.dead = true;
      scene.remove(item.mesh);
    }
  }

  // Spin and move coins toward the player
  for (const item of coinItems) {
    if (item.dead) continue;

    item.mesh.position.z += speed * dt;
    item.mesh.rotation.y += dt * 4;
    item.mesh.rotation.x = Math.sin(elapsed * 5) * 0.15;

    if (item.mesh.position.z > 15) {
      item.dead = true;
      scene.remove(item.mesh);
    }
  }

  // Remove collected and passed objects
  for (let i = obstacles.length - 1; i >= 0; i--) {
    if (obstacles[i].dead) obstacles.splice(i, 1);
  }

  for (let i = coinItems.length - 1; i >= 0; i--) {
    if (coinItems[i].dead) coinItems.splice(i, 1);
  }

  checkCollisions();

  if (!running) return;

  // Camera gently follows the player
  camera.position.x += (player.position.x * 0.25 - camera.position.x) *
    Math.min(1, dt * 2);
  camera.lookAt(player.position.x * 0.18, 1, -12);

  updateHUD();
}

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.04);

  if (!paused && running) update(dt);

  // Animate coins even when waiting at the start screen
  renderer.render(scene, camera);
}

// ---------- RESIZE ----------

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

// ---------- START ----------

buildWorld();
createPlayer();
updateHUD();
animate();

})();
</script>
